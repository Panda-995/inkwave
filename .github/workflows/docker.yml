name: docker

# Builds the self-hosted image (static game + LAN relay) for linux/amd64 and linux/arm64 and
# publishes it to ghcr.io/<owner>/inkwave. Runs on every push to main, on version tags and on
# demand from the Actions tab.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/inkwave
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runtime smoke: boot the just-pushed image, verify the web build serves the Chinese page and
  # that the wrangler/workerd relay actually comes up on :8787 (an HTTP response of any code
  # proves workerd is listening; the relay itself only speaks WebSocket).
  smoke:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: boot + probe
        run: |
          docker run -d --name inkwave -p 8490:8490 -p 8787:8787 \
            ghcr.io/${{ github.repository_owner }}/inkwave:sha-${GITHUB_SHA::7}
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8490/ && break || sleep 2
          done
          TITLE=$(curl -sf http://127.0.0.1:8490/)
          echo "$TITLE" | grep -q 'INKWAVE — 占地大乱斗' || { echo 'web page missing Chinese title'; docker logs inkwave; exit 1; }
          curl -sf -o /dev/null http://127.0.0.1:8490/src/main.js || { echo 'module serving broken'; docker logs inkwave; exit 1; }
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8787/)
          [ "$CODE" != "000" ] || { echo 'relay port not answering'; docker logs inkwave; exit 1; }
          echo "smoke ok: web served, relay answered HTTP $CODE"
          docker logs inkwave 2>&1 | tail -20
